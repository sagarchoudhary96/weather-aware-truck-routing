services:
  - type: web
    name: weather-aware-truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_HTTPS_ONLY
        value: "true"
      - key: TOMTOM_API_KEY
        sync: false # entered in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the Vercel URL, set after the frontend is deployed
